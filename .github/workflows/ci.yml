# Nombre que aparecerá en la pestaña "Actions" de GitHub
name: CI

# CUÁNDO se ejecuta
on:
  push:
    branches: [main]        # al subir código a la rama main
  pull_request:
    branches: [main]        # y en cada pull request hacia main (antes de aceptar el cambio)

# QUÉ se ejecuta
jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest  # GitHub nos presta una máquina Linux limpia para cada ejecución

    steps:
      # 1. Descargar el código del repositorio en esa máquina
      - name: Descargar el código
        uses: actions/checkout@v5

      # 2. Instalar Java 25, el mismo que usas tú
      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven      # guarda las dependencias entre ejecuciones: mucho más rápido

      # 3. Compilar y ejecutar los tests
      - name: Compilar y ejecutar los tests
        run: ./mvnw -B verify

      # 4. Construir la imagen con TU Dockerfile (paso 10.4)
      - name: Construir la imagen Docker
        run: docker build -t biblioteca:${{ github.sha }} .