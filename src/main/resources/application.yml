spring:
  application:
    name: biblioteca
  profiles:
    active: dev
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  http:
    clients:
      connect-timeout: 10s  # máximo para ESTABLECER la conexión
      read-timeout: 30s     # máximo para RECIBIR la respuesta
    serviceclient:
      openlibrary:          # el nombre del grupo de @ImportHttpServices
        base-url: https://openlibrary.org

biblioteca:
  nombre: Biblioteca Central
  max-prestamos: 3
  bienvenida:
    activa: true
  jwt:
    emisor: biblioteca-api
    expiracion: 15m          # access token: corto
    expiracion-refresh: 7d   # refresh token: largo ("7d" = 7 días)

springdoc:
  paths-to-match: /api/**