spring:
  application:
    name: biblioteca
  profiles:
    active: dev
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  http:
    clients:
      connect-timeout: 10s  # máximo para ESTABLECER la conexión
      read-timeout: 30s     # máximo para RECIBIR la respuesta
    serviceclient:
      openlibrary:          # el nombre del grupo de @ImportHttpServices
        base-url: https://openlibrary.org

  threads:
    virtual:
      enabled: true

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: biblioteca
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.luiso.biblioteca.*"

biblioteca:
  nombre: Biblioteca Central
  max-prestamos: 3
  bienvenida:
    activa: true
  jwt:
    emisor: biblioteca-api
    expiracion: 15m          # access token: corto
    expiracion-refresh: 7d   # refresh token: largo ("7d" = 7 días)
  recordatorios:
    cron: "0 0 9 * * *"     # todos los días a las 09:00
    dias-prestamo: 14       # a partir de cuántos días se considera vencido

springdoc:
  paths-to-match: /api/**