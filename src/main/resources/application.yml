spring:
  application:
    name: biblioteca
  profiles:
    active: dev
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  http:
    clients:
      connect-timeout: 10s  # máximo para ESTABLECER la conexión
      read-timeout: 30s     # máximo para RECIBIR la respuesta
    serviceclient:
      openlibrary:          # el nombre del grupo de @ImportHttpServices
        base-url: https://openlibrary.org

  threads:
    virtual:
      enabled: true

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: biblioteca
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.luiso.biblioteca.*"

  mvc:
    async:
      request-timeout: 1h   # una conexión del panel puede durar hasta 1 hora

resilience4j:
  retry:
    # Orden de los patrones: el reintento va DENTRO del circuit breaker (explicado abajo)
    retry-aspect-order: 2
    instances:
      openlibrary:
        max-attempts: 3                          # 1 intento + 2 reintentos
        wait-duration: 500ms                     # espera antes del primer reintento
        enable-exponential-backoff: true         # cada espera es el doble que la anterior: 500 ms, 1 s...
        exponential-backoff-multiplier: 2
        retry-exceptions:                        # SOLO se reintentan los fallos pasajeros:
          - org.springframework.web.client.ResourceAccessException    # red, conexión, timeouts
          - org.springframework.web.client.HttpServerErrorException   # errores 5xx del servidor
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      openlibrary:
        register-health-indicator: true          # ← LÍNEA NUEVA
        sliding-window-size: 10                  # mira las últimas 10 llamadas
        minimum-number-of-calls: 5               # no decide nada hasta tener al menos 5
        failure-rate-threshold: 50               # si fallan el 50 % o más → se ABRE
        wait-duration-in-open-state: 30s         # cuánto tiempo permanece abierto
        permitted-number-of-calls-in-half-open-state: 2   # llamadas de prueba en semiabierto

biblioteca:
  nombre: Biblioteca Central
  max-prestamos: 3
  bienvenida:
    activa: true
  jwt:
    emisor: biblioteca-api
    expiracion: 15m          # access token: corto
    expiracion-refresh: 7d   # refresh token: largo ("7d" = 7 días)
  recordatorios:
    cron: "0 0 9 * * *"     # todos los días a las 09:00
    dias-prestamo: 14       # a partir de cuántos días se considera vencido

springdoc:
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        # Lista EXPLÍCITA de endpoints expuestos por HTTP. Nunca "*" en producción
        include: health, info, metrics, loggers, caches, scheduledtasks, flyway, circuitbreakers
  endpoint:
    health:
      show-details: when-authorized   # el detalle de cada componente, solo para usuarios autorizados
      roles: ADMIN                    # ...y solo si tienen este rol
      probes:
        enabled: true                 # activa /health/liveness y /health/readiness
      group:
        readiness:
          include: readinessState, db, redis   # readiness SÍ depende de la BD y de Redis
  health:
    circuitbreakers:
      enabled: true                   # muestra los circuitos de Resilience4j en /health
  info:
    env:
      enabled: true                   # muestra en /info las propiedades info.*
    java:
      enabled: true                   # versión de Java
    os:
      enabled: true                   # sistema operativo

info:
  aplicacion:
    nombre: API de la Biblioteca
    descripcion: Gestión del catálogo, préstamos y socios
    version: 1.0.0