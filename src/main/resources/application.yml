spring:
  application:
    name: biblioteca
  profiles:
    active: dev
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

biblioteca:
  nombre: Biblioteca Central
  max-prestamos: 3
  bienvenida:
    activa: true

springdoc:
  paths-to-match: /api/**