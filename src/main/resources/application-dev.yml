spring:
  config:
    # Carga también secretos.yml. "optional:" → si el archivo no existe, no falla al leerlo
    import: optional:file:./secretos.yml
  flyway:
    # En dev, además de la estructura, carga los datos de ejemplo
    locations: classpath:db/migration,classpath:db/datos-dev
  cache:
    type: redis
    redis:
      time-to-live: 10m          # TTL: cada entrada caduca a los 10 minutos
      cache-null-values: false   # no guardar resultados null

server:
  port: 8080

biblioteca:
  nombre: Biblioteca Central (DESARROLLO)
  cors:
    origenes-permitidos:      # una lista en YAML: un elemento por línea, con guion
      - http://localhost:4200 # Angular
      - http://localhost:5173 # Vite (React, Vue...)

logging:
  level:
    com.luiso.biblioteca: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.springframework.security: DEBUG
  file:
    name: logs/biblioteca.log