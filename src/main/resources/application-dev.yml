server:
  port: 8080

biblioteca:
  nombre: Biblioteca Central (DESARROLLO)

logging:
  level:
    com.luiso.biblioteca: DEBUG   # tu código: todo el detalle
    org.hibernate.SQL: DEBUG                 # muestra cada SQL que ejecuta Hibernate
    org.hibernate.orm.jdbc.bind: TRACE       # muestra los valores de los parámetros
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG   # muestra cuándo se abren y cierran transacciones
  file:
    name: logs/biblioteca.log

springdoc:
  paths-to-match: /api/**   # documenta solo las rutas que empiezan por /api/