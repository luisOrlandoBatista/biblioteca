services:
  postgres:
    image: postgres:18                  # PostgreSQL 18. Fijamos la versión para que no cambie sola
    container_name: biblioteca-postgres # nombre fácil de reconocer
    environment:                        # configuración inicial de PostgreSQL
      POSTGRES_DB: biblioteca           # base de datos que se crea al arrancar por primera vez
      POSTGRES_USER: biblioteca         # usuario
      POSTGRES_PASSWORD: biblioteca     # contraseña (solo para desarrollo)
    ports:
      - "5432:5432"                     # puerto de tu Mac : puerto del contenedor
    volumes:
      - postgres-data:/var/lib/postgresql   # los datos se guardan en el volumen
    
  redis:
    image: redis:7.4-alpine          # "alpine": versión de imagen muy ligera
    container_name: biblioteca-redis
    ports:
      - "6379:6379"                  # puerto estándar de Redis

  kafka:
    image: apache/kafka:4.1.0        # imagen oficial de Apache Kafka
    container_name: biblioteca-kafka
    ports:
      - "9092:9092"                  # puerto estándar de Kafka

  prometheus:
    image: prom/prometheus:latest
    container_name: biblioteca-prometheus
    ports:
      - "9090:9090"
    volumes:
      # Monta el archivo de configuración dentro del contenedor (:ro = solo lectura)
      - ./monitorizacion/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: biblioteca-grafana
    ports:
      - "3000:3000"

volumes:
  postgres-data:                        # Docker crea y gestiona este volumen